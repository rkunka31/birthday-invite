<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP</title>
  <link rel="stylesheet" href="assets/base.css">
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <main class="rsvp-page">
    <header class="hero">
      <div class="decor" aria-hidden="true"></div>
      <p class="eyebrow">You're invited!</p>
      <h1 class="names" data-field="names"></h1>
      <div class="age-badge" data-field="age"></div>
      <p class="tagline">are turning <span data-field="ageWord"></span>!</p>
      <p class="details">
        <strong data-field="dateLabel"></strong><br>
        <span data-field="time"></span><br>
        <span data-field="location" data-placeholder="Location TBD"></span>
      </p>
      <p class="note" data-field="guestNote" data-hide-empty></p>
    </header>

    <section class="panel" id="form-panel">
      <h2>RSVP</h2>
      <p class="sub" data-hide-empty-scope>Please reply by <span data-field="rsvpBy" data-hide-empty></span>.</p>

      <form id="rsvp" novalidate>
        <label class="field">
          <span>Name</span>
          <input name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Phone number</span>
          <input name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
        </label>
        <label class="field">
          <span>Email <em>(optional)</em></span>
          <input name="email" type="email" autocomplete="email">
        </label>
        <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>

        <fieldset>
          <legend>Will you attend?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="attending" value="yes" required><span>Yes!</span></label>
            <label class="choice"><input type="radio" name="attending" value="no"><span>No, sorry</span></label>
          </div>
        </fieldset>

        <button class="btn" type="submit">Send RSVP</button>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="panel thanks" id="thanks" hidden>
      <p class="big" id="thanks-icon"></p>
      <h2 id="thanks-title"></h2>
      <p class="sub" id="thanks-body"></p>
    </section>

    <p class="footer">Questions? Call or text <span data-field="host.name"></span> at
      <a data-href="telHref" data-field="host.phone"></a></p>
  </main>

  <script>
    (function () {
      var form = document.getElementById("rsvp");
      var error = document.getElementById("error");
      var button = form.querySelector("button");

      function showError(msg) { error.textContent = msg; error.hidden = false; }

      function showThanks(attending) {
        document.getElementById("form-panel").hidden = true;
        var yes = attending === "yes";
        document.getElementById("thanks-icon").textContent = yes ? "🎉" : "💌";
        document.getElementById("thanks-title").textContent = yes ? "See you there!" : "Thanks for letting us know";
        document.getElementById("thanks-body").textContent = yes
          ? PARTY.dateLabel + " at " + PARTY.time + ". " + (PARTY.guestNote || "")
          : "We'll miss you. Thanks for replying.";
        document.getElementById("thanks").hidden = false;
        window.scrollTo(0, 0);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        error.hidden = true;
        var data = new FormData(form);
        var name = (data.get("name") || "").trim();
        var phone = (data.get("phone") || "").trim();
        var email = (data.get("email") || "").trim();
        var attending = data.get("attending");

        if (!name) return showError("Please enter your name.");
        if (phone.replace(/\D/g, "").length < 10) return showError("Please enter a 10-digit phone number.");
        if (email && !form.email.checkValidity()) return showError("That email address doesn't look right.");
        if (!attending) return showError("Please choose yes or no.");
        if (data.get("website")) return showThanks(attending); // bot filled the hidden field

        if (!PARTY.rsvpEndpoint) {
          return showError("Online RSVP isn't connected yet. Please text " + PARTY.host.name + " at " + PARTY.host.phone + ".");
        }

        button.disabled = true;
        button.textContent = "Sending…";
        // Apps Script doesn't send CORS headers, so post as a simple form request and don't read the reply.
        fetch(PARTY.rsvpEndpoint, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams({ name: name, phone: phone, email: email, attending: attending })
        }).then(function () {
          showThanks(attending);
        }).catch(function () {
          button.disabled = false;
          button.textContent = "Send RSVP";
          showError("Something went wrong. Please try again or text " + PARTY.host.name + " at " + PARTY.host.phone + ".");
        });
      });
    })();
  </script>
</body>
</html>
